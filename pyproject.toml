[project]
name = "faas-sdk"
version = "0.1.0"
description = "SDK for FaaS audio functions (spec §5)"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "protobuf>=5.0",
]

[project.optional-dependencies]
# Kept out of the core install so unit tests need no broker, no libsndfile and
# no AWS. A function image installs faas-sdk[runtime].
runtime = [
    "confluent-kafka>=2.5",
    "soundfile>=0.12",
    "numpy>=1.26",
    "boto3>=1.34",
]
# The hydrator image also needs ffmpeg on PATH -- a system package, not a
# Python one. main.py checks for it at boot rather than per message.
hydrator = [
    "confluent-kafka>=2.5",
    "boto3>=1.34",
    "requests>=2.31",
]
metrics = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-prometheus>=0.46b0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # protoc, for `python scripts/gen_proto.py` without the buf binary.
    "grpcio-tools>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `faas` is the generated protobuf tree (proto package faas.v1), committed so a
# function image build never needs protoc.
packages = ["src/faas_sdk", "src/faas_hydrator", "src/faas"]

[project.scripts]
faas-hydrator = "faas_hydrator.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the `functions/` tree on the path: a function lives beside its
# declaration in this repo (§8) rather than inside the SDK package.
pythonpath = ["src", "."]
# Broker tests need Docker and take tens of seconds; the unit suite finishes in
# seconds and that is worth protecting. Run them with `pytest -m kafka`.
addopts = "-q -m 'not kafka and not minio'"
markers = [
    "kafka: needs a real Kafka broker in Docker (excluded by default)",
    "minio: needs a real MinIO object store in Docker (excluded by default)",
]

[tool.ruff]
line-length = 100
# Generated by protoc; regenerate rather than edit.
extend-exclude = ["src/faas"]
# Deployment target is 3.12 (see requires-python), but the source stays
# 3.10-compatible so the suite runs on whatever interpreter is to hand. Bumping
# this will rewrite e.g. timezone.utc -> datetime.UTC and drop that property.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
