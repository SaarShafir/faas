version: v2

modules:
  - path: .

lint:
  use:
    - DEFAULT
  except:
    # Buf's DEFAULT rules want both STATUS_UNSPECIFIED = 0 and STATUS_-prefixed
    # values. The zero value now follows the convention (see result.proto), but
    # the named states keep the spec's §6 spelling -- SUCCESS, not
    # STATUS_SUCCESS -- so the wire matches the document everyone is reading.
    - ENUM_VALUE_PREFIX

breaking:
  use:
    # The envelope is topic-wide and long-lived: field numbers and types are
    # frozen once published (§6, §10). Renaming is allowed -- it does not
    # change the wire -- and is how a field gets clarified without a migration.
    - WIRE_JSON
