# The reference function (spec §13 step 4) and the contract test for the whole
# platform. Deliberately trivial: it exists to prove the path works end to end,
# not to be useful.
#
# Adding a function is this file plus function.py -- one PR, zero infra tickets
# (§8).
function_id: duration_rms
function_version: "1.0.0"
image: registry/faas-duration-rms:1.0.0
resources:
  cpu: 1
  memory: 512Mi
# One consumer per pod with shallow depth is the §5.2 default; the autoscaler
# scales pod count on lag. Nothing here justifies a process pool.
in_flight: 2
# Generous for what is a decode and two numpy passes. A file that takes two
# minutes here means something is wrong, and the timeout should say so.
per_file_timeout_seconds: 30
retry_budget: 3
dlq_topic: faas.dlq.duration_rms
payload_schema: schemas/duration_rms/v1.json
